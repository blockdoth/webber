{{extends "layout.html"}}



{{ block body }}
<h1>Blockdoth</h1>

<h4>Recent posts</h1>
  {{for post in posts}}
  <ul>
    <li>{{post.published}} - <a href="{{post.slug}}"> {{post.title}} </a></li> 
  </ul>
  
  {{endFor}}
  

<br>

<h4>Sites I like</h1>
{{for blog in cool_blogs}}
  <ul>
    <li> <a href="https://{{blog}}">{{blog}}</a> </li> 
  </ul>
{{endFor}}
  

{{ endBlock }}
