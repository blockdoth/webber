[package]
name = "webber"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "webber"
path = "main.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(generated)'] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.profiling]
inherits = "release"
debug = true
strip = false